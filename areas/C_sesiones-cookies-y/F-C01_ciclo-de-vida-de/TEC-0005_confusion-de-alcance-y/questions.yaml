id: TEC-0005
title: Confusion de alcance y precedencia de cookies (cookie tossing / shadowing)
description: Un atacante con control de un subdominio (o de un path) puede inyectar una cookie que el
  backend prefiera sobre la legitima, fijando o corrompiendo la sesion.
area: C
area_title: Sesiones, cookies y tokens
family_id: F-C01
family_name: Ciclo de vida de sesiones y tokens
technique_id: TEC-0005
variant_of: null
hypothesis: Un atacante con control de un subdominio (o de un path) puede inyectar una cookie que el backend
  prefiera sobre la legitima, fijando o corrompiendo la sesion.
behavior: Cual de varias cookies con el mismo nombre prevalece cuando difieren en Domain/Path, y si el
  servidor elige una distinta de la que cree.
