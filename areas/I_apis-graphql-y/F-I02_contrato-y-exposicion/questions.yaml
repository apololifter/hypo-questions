    TEC-0190 (Mass assignment en registro (rol en signup)), TEC-0198 (Mass assignment via JSON Merge Patch
    / JSON Patch), TEC-0199 (Mass assignment via parametros de query), TEC-0200 (Mass assignment via notacion
    de formularios anidados), TEC-0201 (Bypass por claves duplicadas en JSON), TEC-0202 (Over-posting
    de claves primarias/foraneas (id/FK)), TEC-0203 (Over-posting de flags de estado (emailVerified/enabled)),
    TEC-0204 (Over-posting de asociaciones (_ids / relations)), TEC-0205 (Over-posting en endpoints bulk/batch
    (createMany)), TEC-0206 (Over-posting en importacion masiva (CSV/Excel)), TEC-0207 (Bypass de allowlist
    por conversion de nombres (snake/camel)), TEC-0210 (Over-posting via PUT (reemplazo total)), TEC-0213
